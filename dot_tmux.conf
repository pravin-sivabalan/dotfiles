set-window-option -g mode-keys vi
set -g status-keys vi
set-option -g prefix C-Space
set-option -g status-position top
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
bind & kill-window
bind Left select-pane -L
bind Right select-pane -R

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#333333"
set -g pane-border-lines single
set -g pane-border-status off

# Status bar
set -g status-style "bg=default,fg=default"
set -g status-justify centre
set -g status-left "#{?client_prefix,#[bg=#698DDA fg=#000000 bold] tmux #[default],}"
set -g status-left-length 20
set -g status-right "#[fg=#698DDA]#S"
set -g status-right-length 20

set -g window-status-separator ""
set -g window-status-format ' #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //"),#W} '
set -g window-status-current-format '#[fg=#698DDA,bg=default]#[fg=#698DDA] #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //"),#W} #{?window_zoomed_flag,󰊓 ,}#[fg=#698DDA,bg=default]'

